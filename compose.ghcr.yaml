services:
  backend:
    image: ghcr.io/neuralcrypt/aquaguard/backend:sha-125dda1
    environment:
      DATABASE_URL: postgresql+psycopg://water_app:${POSTGRES_PASSWORD:-local_dev_password_change_me}@db:5432/water_monitoring
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123456}
      DEVICE_API_KEY: ${DEVICE_API_KEY}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    image: ghcr.io/neuralcrypt/aquaguard/frontend:sha-125dda1
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    external: true
    name: water-monitoring-system_default
