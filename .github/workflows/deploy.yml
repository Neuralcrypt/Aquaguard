name: Deploy (optional remote host)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check deployment configuration
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ] || [ -z "${{ secrets.DEPLOY_USER }}" ] || [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ] || [ -z "${{ secrets.POSTGRES_PASSWORD }}" ]; then
            echo "Configure DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, and POSTGRES_PASSWORD in the staging environment before deployment."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Copy compose files and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD" > .env
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p ~/water-monitoring-system'
          scp compose.yaml compose.production.yaml .env "$DEPLOY_USER@$DEPLOY_HOST:~/water-monitoring-system/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'cd ~/water-monitoring-system && docker compose -f compose.yaml -f compose.production.yaml up -d --build'
          rm -f .env
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'curl --fail http://localhost:8000/api/health'
